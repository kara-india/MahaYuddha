name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation structure
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required project documents
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s research/product-brief.md
          test -s research/market-validation.md
          test -s research/sources.md
          test -s workflows/DEVELOPMENT_WORKFLOW.md
          test -s workflows/RESEARCH_WORKFLOW.md
          echo "Required project documents are present."

      - name: Check for whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          if git diff --check HEAD^ HEAD; then
            echo "No whitespace errors detected."
          else
            echo "Whitespace check failed."
            exit 1
          fi
